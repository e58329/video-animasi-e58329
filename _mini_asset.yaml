# Demo pipeline aset otomatis — POLICY ZERO-ATTRIBUTION
# Visual di bawah TIDAK punya fungsi gambar manual di VISUALS:
#   rocket_launch -> CC0 pool (system-uicons, Unlicense)
#   anchor_drop   -> CC0 pool via tangga kata-pertama (pinhead, CC0-1.0)
#   quantum_field -> TIDAK ada yang CC0 -> otomatis ditolak -> kartu generic
# (untuk pakai lisensi butuh-atribusi, tambahkan: assets_attribution: true)
asset_overrides:
  anchor_drop:
    color: "#FFC107"             # jangkar kuning accent channel
title: "Uji Aset Tanpa Atribusi"
template: "explainer"
question: "Semua visual di episode ini diambil otomatis dari internet dengan lisensi yang tidak mewajibkan atribusi sama sekali. Jadi aman dari kelupaan kredit."
sections:
  - heading: "1. Uji Zero-Attribution"
    points:
      - text: "Roket ini dari koleksi system-uicons dengan lisensi unlicense."
        visual: "rocket_launch"
      - text: "Jangkar kuning ini dari koleksi pinhead dengan lisensi C C nol."
        visual: "anchor_drop"
      - text: "Kartu ini muncul karena tidak ada ikon bebas atribusi untuk kuantum."
        visual: "quantum_field"
conclusion: "Roket dan jangkar tampil dari sumber bebas atribusi. Kartu generik membuktikan penolakan lisensi berjalan aman. Video ini bebas kewajiban kredit."
audio_duration: 46

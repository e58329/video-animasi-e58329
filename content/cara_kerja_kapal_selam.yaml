title: "Rahasia Teknologi Kapal Selam"
template: "explainer"
question: "Bagaimana mungkin sebuah logam raksasa seberat ribuan ton bisa menyelam jauh ke dalam laut, menahan tekanan air yang luar biasa, dan kemudian muncul kembali ke permukaan dengan aman?"
sections:
  - heading: "1. Sejarah: Dari Kayu ke Logam"
    points:
      - text: "Ide tentang kendaraan bawah air sudah ada sejak zaman kuno, seperti lonceng kaca Alexander the Great."
        visual: "history_ancient"
      - text: "Namun, kapal selam modern pertama dibuat tahun 1620 oleh Cornelis Drebbel, menggunakan kayu dan kulit yang dilapisi lilin."
        visual: "history_wood"
      - text: "Pada Perang Dunia, bentuknya berevolusi menjadi silinder logam yang kita kenal sekarang."
        visual: "history_modern"
  - heading: "2. Prinsip Fisika: Hukum Archimedes"
    points:
      - text: "Pertanyaan paling mendasar: bagaimana benda berat bisa mengapung atau tenggelam?"
        visual: "archimedes_question"
      - text: "Hukum Archimedes: benda yang dicelupkan ke air akan mengalami gaya ke atas sebesar berat air yang dipindahkannya."
        visual: "archimedes_law"
      - text: "Jika berat kapal lebih kecil dari air yang dipindahkan, kapal mengapung. Jika lebih berat, kapal tenggelam."
        visual: "archimedes_float"
  - heading: "3. Rahasia Tangki Pemberat"
    points:
      - text: "Di lambung luar kapal, terdapat ruang khusus yang disebut tangki pemberat (ballast tanks)."
        visual: "ballast_tank"
      - text: "Saat menyelam, katup dibuka. Udara keluar, air laut masuk mengisi kekosongan."
        visual: "water_in"
      - text: "Kapal menjadi lebih berat dari air, sehingga perlahan tenggelam ke dasar laut."
        visual: "sinking"
      - text: "Untuk naik, udara bertekanan tinggi dihembuskan ke tangki, mendorong air keluar."
        visual: "air_in"
conclusion: "Kapal selam adalah mahakarya teknik paling luar biasa. Dari prinsip daya apung sederhana, manusia menciptakan kendaraan untuk menjelajahi dunia yang gelap dan penuh tekanan di bawah laut."

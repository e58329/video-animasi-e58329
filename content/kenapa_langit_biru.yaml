title: "Kenapa Langit Berwarna Biru?"
template: "explainer"
question: "Kenapa langit biru, bukan ungu atau hijau?"
sections:
  - heading: "1. Cahaya Matahari"
    points:
      - "Cahaya matahari sebenarnya terdiri dari banyak warna."
      - "Warna-warna ini memiliki panjang gelombang yang berbeda."
  - heading: "2. Hamburan Rayleigh"
    points:
      - "Saat masuk atmosfer, cahaya biru paling banyak dihamburkan."
      - "Fenomena ini disebut hamburan Rayleigh."
conclusion: "Langit biru bukan karena pantulan laut, tapi karena fisika cahaya!"
